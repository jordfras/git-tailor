[package]
name = "git-tailor"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Thomas Johannesson"]
description = """
An interactive terminal tool for tidying up Git commits on a branch —
squash, reorder, split, drop, and reword commits before submitting a
pull request or pushing to a shared branch.
"""
repository = "https://github.com/jordfras/git-tailor"
keywords = ["git", "commit", "tui", "squash", "split"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = ["/.github", "about.hbs", "about.toml", "deny.toml", "demo", "doc", "examples", "AGENTS.md", "TASKS.md", "TASKS-COMPLETED.md", "RELEASE.md"]

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.21", default-features = false }
anyhow = "1.0"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used by the
# dialog overlay to size and scroll itself by wrapped rows rather than logical
# lines (so long lines that wrap are not clipped / left unreachable).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
clap = { version = "4", default-features = false, features = ["std", "derive", "wrap_help", "help", "usage", "error-context", "suggestions", "env"] }
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
shell-words = "1"
update-informer = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "handleapi"] }

[dev-dependencies]
insta = "1"
# Used only by the `gen_screenshot` example to rasterize the rendered TUI buffer
# into doc/tui_example.png. Not part of the published crate (examples are excluded).
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
