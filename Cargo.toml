[package]
name = "git-tailor"
version = "3.1.0"
edition = "2024"
# 1.89 for `File::try_lock`, used by `session_lock`.
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Thomas Johannesson"]
description = """
An interactive terminal tool for tidying up Git commits on a branch —
squash, reorder, split, drop, and reword commits before submitting a
pull request or pushing to a shared branch.
"""
repository = "https://github.com/jordfras/git-tailor"
keywords = ["git", "commit", "tui", "squash", "split"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = ["/.github", "/.claude", "/.vscode", "about.hbs", "about.toml", "deny.toml", "demo", "doc", "examples", "CLAUDE.md", "TASKS.md", "TASKS-COMPLETED.md", "RELEASE.md", "release.sh"]

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.21", default-features = false }
anyhow = "1.0"
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, used by the
# dialog overlay to size and scroll itself by wrapped rows rather than logical
# lines (so long lines that wrap are not clipped / left unreachable).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
clap = { version = "4", default-features = false, features = ["std", "derive", "wrap_help", "help", "usage", "error-context", "suggestions", "env"] }
# Pinned tightly because dynamic is unstable.
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
shell-words = "1"
# `platform-verifier` makes ureq validate TLS against the operating system's
# trust store rather than its compiled-in Mozilla roots. A TLS-inspecting
# proxy signs with a private CA that only ever lands in the system store, so
# the Mozilla roots reject it and the update check dies with `UnknownIssuer`.
ureq = { version = "3", features = ["json", "platform-verifier"] }
etcetera = "0.11"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "handleapi"] }

[dev-dependencies]
insta = "1"
# Used only by the `gen_screenshots` example to rasterize rendered TUI buffers
# into doc/. Not part of the published crate (examples are excluded).
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
