TITLE="Opening a commit"
NARRATION_DELAY=1.5
TITLE_AT=0.4
TITLE_HOLD=2.8

# Timed against the voice: line 2 starts at 8.75s and line 3 at 16.95s, plus
# NARRATION_DELAY. Line 3 names four keys in five seconds, which is one caption
# and not four -- a cue is up from AT to AT+HOLD+1.0s counting the fades, so
# four of them could not clear each other inside the line that names them.
CAPTIONS=(
    "4.2 3.0 - Enter opens the selected commit"
    "10.1 3.4 - Ctrl-Left and Ctrl-Right move the divider"
    "21.7 4.0 - PgDn and PgUp a screen, g and G the ends"
    "26.8 2.3 - q closes it again"
)
