name: Release

# Builds pre-built `gt` binaries and attaches them to the GitHub Release.
#
# Normal path: pushing a `v*` tag (see RELEASE.md) creates the release and
# uploads binaries for every target below.
#
# Backfill / re-run: trigger manually (Actions -> Release -> Run workflow, or
# `gh workflow run release.yml -f tag=v2.0.0`) to build for an already-existing
# tag without moving it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build binaries for (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # On a tag push `github.ref` is already `refs/tags/v*`; on manual
          # dispatch we point at the tag named in the input.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target builds natively — each Linux/Windows runner is already
          # the right architecture, and musl is a libc swap, not a cross. The
          # arm64 Linux build uses GitHub's arm64 runner rather than
          # cross-compiling, which would otherwise mean an aarch64 musl C
          # toolchain for the vendored libgit2/libz sources. macOS ships one
          # universal binary — the arm64 and x86_64 slices lipo'd together —
          # built on Apple Silicon, so it runs natively on any Mac and avoids
          # Intel runners.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: universal-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      # The vendored libgit2/libz C sources are compiled for musl via musl-gcc.
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gt
          target: ${{ matrix.target }}
          build-tool: cargo
          archive: gt-$tag-$target
          checksum: sha256
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Points the formula in jordfras/homebrew-tap at this release. After
  # upload-assets, so a failed build skips it instead of publishing a formula
  # naming a missing archive. The binaries are out by then, so a failure here
  # only leaves the formula a release behind: rerun the job, or run the script
  # and commit to the tap by hand.
  update-tap:
    needs: upload-assets
    # A manual run rebuilds binaries for an older tag, which must not move the
    # formula back to it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      # GITHUB_TOKEN cannot push to another repository; the deploy key is
      # scoped to the tap alone.
      - uses: actions/checkout@v5
        with:
          repository: jordfras/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Write the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/homebrew/update-formula.sh "$TAG" tap/Formula/git-tailor.rb
      - name: Commit it to the tap
        working-directory: tap
        run: |
          git add Formula/git-tailor.rb
          if git diff --cached --quiet; then
            echo "The formula already points at $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "git-tailor ${TAG#v}"
          git push
