[package]
name = "git-tailor"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Thomas Johannesson"]
description = """
An interactive terminal tool for tidying up Git commits on a branch —
squash, reorder, split, drop, and reword commits before submitting a
pull request or pushing to a shared branch.
"""
repository = "https://github.com/jordfras/git-tailor"
keywords = ["git", "commit", "tui", "squash", "split"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = ["/.github", "about.hbs", "about.toml", "deny.toml", "examples", "AGENTS.md", "TASKS.md", "TASKS-COMPLETED.md", "RELEASE.md"]

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.20", default-features = false }
anyhow = "1.0"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", default-features = false, features = ["std", "derive", "wrap_help", "help", "usage", "error-context", "suggestions", "env"] }
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
shell-words = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "handleapi"] }

[dev-dependencies]
insta = "1"
