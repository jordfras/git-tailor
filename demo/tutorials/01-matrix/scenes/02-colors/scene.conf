TITLE="What the colors mean"
NARRATION_DELAY=0.6
TITLE_AT=0.4
TITLE_HOLD=3.0

# The narration names the bright column a sentence before the dimmed ones, so
# they mark in that order rather than together. Nothing may mark before ~3.4s:
# until the tape has launched gt and moved the cursor there is either an empty
# terminal or another commit's dimming on screen. The selected commit touches
# the second column, so the dimmed ones are either side of it.
MARKERS=(
    "3.9 2.1 1218 52 18 246"    # the bright column the commit touches
    "6.4 3.3 1201 52 17 246"    # then the dimmed column to the left
    "6.4 3.3 1235 52 34 246"    # and the two dimmed ones to the right
    "10.2 4.5 1218 90 18 27"    # the green square on the selected commit
)
