TITLE="Rows and columns"
NARRATION_DELAY=1.5
TITLE_AT=0.4
TITLE_HOLD=3.0

# Terminal cells. The commit list starts at row 1, under the header; the four
# matrix columns are 72 to 75, right of the pane divider.
MARKERS=(
    "4.8 1.2 56 1 3 2 arrow-up"     # oldest, at the top -- gone before
    "6.4 3.0 56 6 3 2 arrow-down"   # newest arrives, so only one shows
    "15.4 2.4 72 1 4 7"             # the matrix: every column, every row
    "18.4 2.2 0 2 76 1"             # one row, from the list to the matrix
    "21.0 5.0 73 1 1 7"             # one column
    "26.9 4.5 73 2 1 1"             # one square, in that column
)

CAPTIONS=(
    "12.0 3.4 - --reverse puts newest on top"
)
