# What differs between this video and the promo. compose.sh reads it, and
# anything not set here keeps the promo's value — so this file is the whole
# difference between an infomercial and a tutorial.

OUT_BASE=tutorial-02-reshaping

# Placed unresized rather than scaled to fill, as tutorial 1 is: a tutorial is
# paused and re-watched, so the text being exactly as sharp as it was captured
# is worth a few percent of picture size.
PICTURE_FIT=pad

# af_heart reads plainly. The promo's bm_lewis is an announcer, which is the
# wrong register for something meant to be paused and re-watched.
TTS_VOICE=${TTS_VOICE:-af_heart}
TTS_SPEED=${TTS_SPEED:-1.0}

# No channel ident, no bed, and none of the announcer compression: nothing
# should compete with the words. A logo that appears rather than arrives, so
# the title card is a title card and not an entrance.
BUMPER=none
MUSIC=none
VOICE_FILTER=none
LOGO_SPIN=0
